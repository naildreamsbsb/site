<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha o serviço | Nail Dreams</title>
  <link rel="stylesheet" href="css/agendar.css?v=4">
  <link rel="stylesheet" href="css/theme.css?v=3">
  <script src="js/theme.js?v=1"></script>
</head>
<body class="booking-page">
  <header class="booking-header">
    <a class="booking-brand" href="cliente.html" aria-label="Voltar para a área da cliente">
      <img class="brand-logo" src="assets/logo.png" alt="Logo Studio Nail Dreams">
      <span><strong>Nail Dreams</strong><small>Novo agendamento</small></span>
    </a>
    <a class="back-link" href="cliente.html">Voltar para minha área</a>
  </header>

  <main class="booking-main">
    <div class="page-heading">
      <p class="eyebrow">Etapa 1</p>
      <h1>Escolha seus procedimentos</h1>
      <p>Adicione até 10 procedimentos na ordem em que deseja realizá-los.</p>
    </div>

    <p id="booking-message" class="message" role="alert" aria-live="polite"></p>

    <div class="service-category-tabs" role="group" aria-label="Categorias de serviços">
      <button class="is-active" type="button" data-service-category="unhas" aria-pressed="true">Unhas</button>
      <button type="button" data-service-category="olhos" aria-pressed="false">Olhos</button>
      <button type="button" data-service-category="corpo" aria-pressed="false">Corpo</button>
    </div>

    <section id="services-loading" class="loading-card" aria-live="polite">
      <span class="loading-mark" aria-hidden="true"></span>
      <p>Carregando serviços disponíveis...</p>
    </section>

    <section id="services-content" class="services-content" aria-label="Serviços disponíveis" hidden></section>
    <aside id="selection-summary" class="selection-summary" hidden>
      <div class="selection-overview"><strong id="selection-count">0 procedimentos</strong><span id="selection-totals"></span></div>
      <div id="selection-list" class="selection-list" aria-label="Sequência selecionada"></div>
      <button id="continue-button" type="button">Escolher profissionais</button>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/supabaseClient.js?v=1"></script>
  <script src="js/agendar.js?v=5"></script>
</body>
</html>
