<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha | Nail Dreams</title>
  <link rel="stylesheet" href="css/style.css?v=1">
  <link rel="stylesheet" href="css/theme.css?v=3">
  <script src="js/theme.js?v=1"></script>
</head>
<body class="login-page">
  <main class="login-card reset-card">
    <h1>Redefinir senha</h1>
    <p class="reset-intro">Escolha uma nova senha para acessar o painel.</p>

    <p id="reset-message" class="message info" role="alert" aria-live="polite">Validando link de recuperação...</p>

    <form id="reset-password-form" class="stack">
      <label>
        Nova senha
        <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label>
        Confirmar nova senha
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button id="save-password-button" type="submit" disabled>Salvar nova senha</button>
    </form>

    <a class="back-link" href="login.html">Voltar ao login</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/supabaseClient.js?v=3"></script>
  <script src="js/reset-password.js?v=1"></script>
</body>
</html>
