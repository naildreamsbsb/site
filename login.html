<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a94f72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nail Dreams">
  <title>Login administrativo | Nail Dreams</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <span class="brand-mark">ND</span>
      <div>
        <h1>Nail Dreams</h1>
        <p>Painel administrativo</p>
      </div>
    </div>

    <section id="active-session" class="stack active-session" hidden>
      <p>Você já está conectado como:<br><strong id="active-session-user"></strong></p>
      <button id="continue-session-button" type="button">Continuar</button>
      <button id="switch-user-button" class="button-secondary" type="button">Trocar usuário</button>
    </section>

    <form id="login-form" class="stack">
      <label>
        E-mail
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Senha
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="login-button" type="submit">Entrar</button>
      <button id="forgot-password-button" class="text-button" type="button">Esqueci minha senha</button>
    </form>
    <p id="login-message" class="message" role="alert" aria-live="polite"></p>
    <a class="back-link" href="index.html">Voltar ao site Nail Dreams</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/supabaseClient.js?v=1"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/pwa.js?v=1"></script>
</body>
</html>
